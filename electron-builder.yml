appId: com.baldlauncher.app
productName: Bald Launcher
artifactName: Bald-Launcher-Setup-${version}.${ext}
npmRebuild: false
directories:
  output: build-release-validation
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
files:
  - main.js
  - preload.js
  - playit-manager.js
  - bald_launcher_v7.html
  - TERMS.md
  - LICENSE.md
  - build/icon.ico
  - build/bald-launcher-mark.svg
  - node_modules/**/*
  - patches/**/*
  - src/**/*
  - package.json
extraResources:
  - from: minecraft-mod/build/libs/bald-launcher-client-0.1.0.jar
    to: baldlauncher/bald-launcher-client.jar
publish:
  provider: github
  owner: TheoNotBald
  repo: Bald-Launcher
  releaseType: release