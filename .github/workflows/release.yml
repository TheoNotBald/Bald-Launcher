name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($tagVersion -ne $packageVersion) {
              throw "Release tag v$tagVersion does not match package.json version $packageVersion."
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and verify Bald Minecraft mod
        shell: pwsh
        run: |
          npm run build:minecraft-mod -- --rerun-tasks
          $mod = Join-Path $PWD 'minecraft-mod\build\libs\bald-launcher-client-0.1.0.jar'
          if (-not (Test-Path -LiteralPath $mod -PathType Leaf)) {
            throw "Bald Minecraft mod was not built: $mod"
          }

      - name: Build Windows installer without publishing
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          $bundledMod = Join-Path $PWD 'build-release-validation\win-unpacked\resources\baldlauncher\bald-launcher-client.jar'
          if (-not (Test-Path -LiteralPath $bundledMod -PathType Leaf)) {
            throw "Windows app package is missing the Bald Minecraft mod: $bundledMod"
          }

      - name: Publish installer and updater metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { "v$version" }
          $output = Join-Path $PWD 'build-release-validation'
          $expectedInstallerName = "Bald-Launcher-Setup-$version.exe"
          $installer = Join-Path $output $expectedInstallerName
          $blockmap = "$installer.blockmap"
          $latest = Join-Path $output 'latest.yml'

          foreach ($file in @($installer, $blockmap, $latest)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected release asset was not generated: $file"
            }
          }

          $metadata = Get-Content -LiteralPath $latest -Raw
          if ($metadata -notmatch "(?m)^version: $([regex]::Escape($version))$" -or
              $metadata -notmatch "(?m)^path: $([regex]::Escape($expectedInstallerName))$") {
            throw "Generated latest.yml does not describe version $version and $expectedInstallerName."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $blockmap $latest --clobber
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            gh release create $tag $installer $blockmap $latest --title "Bald Launcher $version" --notes "Windows release $version" --verify-tag
          } else {
            gh release create $tag $installer $blockmap $latest --title "Bald Launcher $version" --notes "Windows release $version" --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release upload failed for $tag."
          }

          $release = gh release view $tag --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object name)
          foreach ($requiredAsset in @($expectedInstallerName, "$expectedInstallerName.blockmap", 'latest.yml')) {
            if ($requiredAsset -notin $assetNames) {
              throw "Published release $tag is missing required asset $requiredAsset."
            }
          }
