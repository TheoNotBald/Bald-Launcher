name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($tagVersion -ne $packageVersion) {
              throw "Release tag v$tagVersion does not match package.json version $packageVersion."
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
